[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creo-elements-mcp"
version = "2.8.0"
description = "MCP server for PTC Creo Elements/Direct Modeling Express 9.0 (via DDE)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "cad", "creo", "creo-elements-direct", "dde", "lisp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# O servidor precisa do SDK `mcp` (versao 2.x: usa mcp.server.mcpserver).
# Testado com mcp 2.3.0 e Python 3.13/3.14. O DDE so existe no Windows.
dependencies = ["mcp>=2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
creo-mcp = "creo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
